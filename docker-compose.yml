services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: swipefilm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Défini dans .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swipefilm"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  # ✅ Un seul conteneur — le backend sert le frontend statique directement
  # (voir Dockerfile/Program.cs). Plus de service "frontend" séparé.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./swipefilm/swipefilm/.env
    environment:
      # ✅ Surcharge la valeur de .env (qui pointe sur 127.0.0.1 pour le dev
      # local) — dans le réseau Docker, Postgres est joignable par nom de
      # service, pas par localhost.
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=swipefilm;Username=postgres;Password=${POSTGRES_PASSWORD:?Défini dans .env}"
    volumes:
      # ✅ config/settings.json (Jellyfin/Radarr/Sonarr) et les logs
      # survivent aux redéploiements du conteneur.
      - app-config:/app/config
      - app-logs:/app/logs
    ports:
      - "8000:3000"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/api/setup/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

volumes:
  postgres-data:
  app-config:
  app-logs:
