# docker-compose.prod.yml — utilisé sur le serveur (pas en local)
# L'image est tirée du registry, pas buildée sur place.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: swipefilm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Défini dans .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swipefilm"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/JEPTRA2331689/swipefilm:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=swipefilm;Username=postgres;Password=${POSTGRES_PASSWORD}"
    volumes:
      - app-config:/app/config
      - app-logs:/app/logs
    ports:
      - "8000:3000"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/api/setup/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

volumes:
  postgres-data:
  app-config:
  app-logs:
